<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  div {
    position: absolute; inset: 10px; border-radius: 28px; display: grid; place-items: center;
    background: rgba(47, 123, 240, .92); color: #fff; font: 700 140px/1 "Segoe UI", sans-serif;
    animation: in .2s ease-out;
  }
  @keyframes in { from { transform: scale(.85); opacity: 0; } }
</style>
</head>
<body>
<!-- The screen's number, shown for a moment while the operator picks screens. -->
<div id="n"></div>
<script>document.getElementById('n').textContent = new URLSearchParams(location.search).get('n') || '';</script>
</body>
</html>
