<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; media-src file: blob: mediastream:; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Ma3madan Play</title>
<link rel="stylesheet" href="control.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z" fill="currentColor"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 5v14l10-7zM16 5h3v14h-3z" fill="currentColor"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 5v14L9 12zM5 5h3v14H5z" fill="currentColor"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z" fill="currentColor"/></symbol>
  <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z" fill="currentColor"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="i-add" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
  <symbol id="i-yt" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" fill="currentColor"/><path d="M10 9v6l5-3z" fill="var(--yt-play)"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-win-min" viewBox="0 0 24 24"><path d="M6 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-win-max" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5" stroke="currentColor" stroke-width="1.6" fill="none"/></symbol>
  <symbol id="i-win-restore" viewBox="0 0 24 24"><rect x="5.5" y="8.5" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M8.5 8.5V7a1.5 1.5 0 0 1 1.5-1.5h7A1.5 1.5 0 0 1 18.5 7v7a1.5 1.5 0 0 1-1.5 1.5h-1.5" stroke="currentColor" stroke-width="1.6" fill="none"/></symbol>
  <symbol id="i-win-close" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 19h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="17.5" cy="16" r="2.5" fill="currentColor"/></symbol>
  <symbol id="i-caret" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 11v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.3" fill="currentColor"/></symbol>
  <symbol id="i-github" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></symbol>
  <symbol id="i-screens" viewBox="0 0 24 24"><rect x="2.5" y="4" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="2" fill="none"/><rect x="9.5" y="9" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M15.5 18v2.5M12.5 21h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4L5.3 5.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-theme-system" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></symbol>
  <symbol id="i-theme-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9L5.3 5.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-theme-dark" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></symbol>
  <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M15 4.5v15" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-black" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2" fill="currentColor"/><path d="M9 20.5h6M12 17v3.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-autonext" viewBox="0 0 24 24"><path d="M4 6h11M4 11h11M4 16h6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 13.5v7l6-3.5z" fill="currentColor"/></symbol>
  <symbol id="i-black-end" viewBox="0 0 24 24"><path d="M3 12h8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="12" r="2.2" fill="currentColor"/><rect x="14.5" y="6" width="7" height="12" rx="1.5" fill="currentColor"/></symbol>
  <symbol id="i-loop" viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M20 6H8a4 4 0 0 0-4 4v1M7 21l-3-3 3-3M4 18h12a4 4 0 0 0 4-4v-1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-speed" viewBox="0 0 24 24"><path d="M4.2 17.5a8.5 8.5 0 1 1 15.6 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 13.5l4-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="1.9" fill="currentColor"/></symbol>
  <symbol id="i-aspect" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 12V9h3M17 12v3h-3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-hd" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 9v6M7 12h3.5M10.5 9v6M14 9v6h1.6a3 3 0 0 0 0-6z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="14.5" r="3.2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="7" r="1.3" fill="currentColor"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/><path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
</svg>

<header>
  <div class="brand">
    <img src="assets/app-64.png" srcset="assets/app-64.png 1x, assets/app-128.png 2x" alt="" class="app-icon">
    <div class="brand-name" data-i18n="appName"></div>
    <button id="aboutBtn" class="about-btn" data-i18n-title="about"><svg><use href="#i-info"/></svg></button>
  </div>
  <div class="spacer"></div>
  <button id="updateBtn" class="update" hidden><svg><use href="#i-download"/></svg><span></span></button>
  <button id="themeBtn" class="icon-btn"><svg><use href="#i-theme-system"/></svg></button>
  <button id="langBtn" class="icon-btn"><svg><use href="#i-globe"/></svg></button>
  <button id="sideBtn" class="icon-btn" data-i18n-title="tSidebar"><svg><use href="#i-sidebar"/></svg></button>
</header>

<main>
  <section class="stage">
    <div class="preview-wrap">
      <div class="preview">
        <div id="audioBadge" class="audio-badge" hidden><svg><use href="#i-music"/></svg><span data-i18n="audioOnly"></span></div>
        <video id="preview" muted autoplay playsinline></video>
      </div>
    </div>

    <div class="now">
      <div id="nowTitle" class="now-title" dir="auto"><span class="marquee"></span></div>
      <div id="nextTitle" class="now-next"></div>
    </div>

    <div class="seek" dir="ltr">
      <span id="tCur">0:00</span>
      <input id="seek" class="range" type="range" min="0" max="1000" value="0" step="1">
      <span id="tDur">0:00</span>
    </div>

    <div class="transport">
      <div class="group" dir="ltr">
        <button id="prevBtn" data-i18n-title="tPrev"><svg><use href="#i-prev"/></svg></button>
        <button id="backBtn" data-i18n-title="tBack"><svg><use href="#i-back"/></svg></button>
        <button id="playBtn" class="primary big" data-i18n-title="tPlay"><svg><use href="#i-play"/></svg></button>
        <button id="fwdBtn" data-i18n-title="tFwd"><svg><use href="#i-fwd"/></svg></button>
        <button id="nextBtn" data-i18n-title="tNext"><svg><use href="#i-next"/></svg></button>
        <button id="stopBtn" data-i18n-title="tStop"><svg><use href="#i-stop"/></svg></button>
      </div>
      <div class="group">
        <button id="blackBtn" class="toggle" data-i18n-title="tBlack"><svg><use href="#i-black"/></svg></button>
        <button id="fullBtn" data-i18n-title="fullTitle"><svg><use href="#i-full"/></svg></button>
      </div>
      <div class="group vol" dir="ltr">
        <button id="muteBtn" data-i18n-title="tMute"><svg><use href="#i-vol"/></svg></button>
        <div class="vol-track">
          <input id="vol" class="range" type="range" min="0" max="200" value="100">
          <i class="vol-mark" title="100%"></i>
        </div>
        <span id="volPct">100%</span>
      </div>
    </div>

    <div class="options">
      <div class="opt-group">
        <label class="opt-btn" data-i18n-title="autoNext"><input type="checkbox" id="autoNext"><svg><use href="#i-autonext"/></svg></label>
        <label class="opt-btn" data-i18n-title="blackOnEnd"><input type="checkbox" id="blackOnEnd" checked><svg><use href="#i-black-end"/></svg></label>
        <label class="opt-btn" data-i18n-title="loop"><input type="checkbox" id="loopChk"><svg><use href="#i-loop"/></svg></label>
      </div>
      <label class="field" data-i18n-title="speed"><svg><use href="#i-speed"/></svg>
        <select id="rateSel" dir="ltr">
          <option value="0.5">0.5×</option><option value="0.75">0.75×</option>
          <option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
        </select>
      </label>
      <label class="field" data-i18n-title="aspect"><svg><use href="#i-aspect"/></svg>
        <select id="aspectSel" data-i18n-title="tAspect"></select>
      </label>
      <label class="field" id="qualityField" style="display:none" data-i18n-title="quality"><svg><use href="#i-hd"/></svg>
        <select id="qualitySel" dir="ltr"></select>
      </label>
      <label class="field" data-i18n-title="audioOut"><svg><use href="#i-speaker"/></svg>
        <select id="sinkSel"></select>
      </label>
    </div>
    <div id="mixer" class="mixer" hidden>
      <span class="mixer-title"><svg><use href="#i-mic"/></svg><span data-i18n="vocalRemover"></span></span>
      <label class="mix-ch"><span data-i18n="vocalsLabel"></span><input id="mixVocals" class="range" type="range" min="0" max="100" dir="ltr"><b id="mixVocalsPct" dir="ltr"></b></label>
      <label class="mix-ch"><span data-i18n="musicLabel"></span><input id="mixMusic" class="range" type="range" min="0" max="100" dir="ltr"><b id="mixMusicPct" dir="ltr"></b></label>
      <div class="mix-presets">
        <button data-preset="karaoke" data-i18n="presetKaraoke"></button>
        <button data-preset="original" data-i18n="presetOriginal"></button>
        <button data-preset="vocals" data-i18n="presetVocals"></button>
      </div>
      <button id="mixSave" class="ghost"><svg><use href="#i-download"/></svg><span data-i18n="saveMix"></span></button>
    </div>
  </section>

  <div id="sideGrip" class="side-grip" data-i18n-title="tSideGrip"></div>
  <aside class="side">
    <form id="ytForm" class="yt">
      <svg class="yt-ico"><use href="#i-yt"/></svg>
      <input id="ytUrl" type="text" dir="ltr" data-i18n-ph="ytPlaceholder" autocomplete="off" spellcheck="false">
      <button type="submit" id="streamBtn" class="primary" data-i18n="stream" data-i18n-title="tStream"></button>
      <button type="button" id="downloadBtn" class="split" data-i18n-title="tDownload"><span data-i18n="download"></span><svg><use href="#i-caret"/></svg></button>
    </form>
    <div class="side-actions">
      <button id="addFilesBtn" class="ghost"><svg><use href="#i-add"/></svg><span data-i18n="addVideos"></span></button>
      <button id="folderBtn" class="ghost"><svg><use href="#i-folder"/></svg><span data-i18n="downloadsFolder"></span></button>
      <button id="ytUpdateBtn" class="ghost small" data-i18n="updateYtdlp"></button>
    </div>

    <div id="downloads" class="downloads"></div>
    <div id="vocalJobs" class="downloads"></div>

    <div class="list-head">
      <span data-i18n="playlist"></span>
      <span id="listCount" class="muted"></span>
    </div>
    <ol id="playlist" class="playlist"></ol>
    <div id="emptyList" class="empty-list" data-i18n="emptyList"></div>

    <div class="screen-panel" id="screenPanel">
      <div class="screen-head" data-i18n="screenHead"></div>
      <button id="modeBtn" hidden><svg><use href="#i-screens"/></svg><span></span></button>
      <label class="field" id="outputField"><span data-i18n="outputScreen"></span>
        <select id="displaySel"></select>
      </label>
    </div>
  </aside>
</main>


<div id="toast" class="toast"></div>
<div id="modal" class="modal" hidden></div>
<div id="dropZone" class="drop-zone" data-i18n="dropHere"></div>
<video id="probe" preload="metadata" muted hidden></video>

<script src="i18n.js"></script>
<script src="control.js"></script>
<script src="vocals-ui.js"></script>
</body>
</html>
