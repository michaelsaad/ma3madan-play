<header>
  <div class="brand">
    <img src="assets/app-64.png" srcset="assets/app-64.png 1x, assets/app-128.png 2x" alt="" class="app-icon">
    <div class="brand-name" data-i18n="appName"></div>
    <button id="aboutBtn" class="about-btn" data-i18n-title="about"><svg><use href="#i-info"/></svg></button>
  </div>
  <div class="spacer"></div>
  <button id="updateBtn" class="update" hidden><svg><use href="#i-download"/></svg><span></span></button>
  <button id="remoteBtn" class="icon-btn" data-i18n-title="tRemote"><svg><use href="#i-phone"/></svg><i class="hdot"></i></button>
  <button id="miniBtn" class="icon-btn" data-i18n-title="tMini"><svg><use href="#i-mini"/></svg></button>
  <button id="settingsBtn" class="icon-btn" data-i18n-title="tSettings"><svg><use href="#i-gear"/></svg></button>
  <button id="sideBtn" class="icon-btn" data-i18n-title="tSidebar"><svg><use href="#i-sidebar"/></svg></button>
</header>

<main>
  <section class="stage">
    <div class="preview-wrap">
      <div class="preview">
        <div id="audioBadge" class="audio-badge" hidden><svg><use href="#i-music"/></svg><span data-i18n="audioOnly"></span></div>
        <video id="preview" muted autoplay playsinline></video>
        <img id="liveFrame" class="live-frame" alt="" hidden>
        <div id="frozenBadge" class="frozen-badge" hidden><svg><use href="#i-freeze"/></svg><span data-i18n="frozenBadge"></span></div>
        <div id="emptyState" class="empty-state" hidden>
          <div class="es-icon"><svg><use href="#i-play"/></svg></div>
          <b id="esTitle"></b>
          <span id="esText"></span>
          <div class="es-actions">
            <button id="esAdd" class="primary"><svg><use href="#i-add"/></svg><span data-i18n="addVideos"></span></button>
            <button id="esPaste"><svg><use href="#i-yt"/></svg><span data-i18n="esPaste"></span></button>
          </div>
          <span class="es-keys" data-i18n-html="esKeys"></span>
        </div>
      </div>
    </div>

    <div class="now">
      <div class="now-top">
        <div id="nowTitle" class="now-title" dir="auto"><span class="marquee"></span></div>
        <div id="statusPill" class="status-pill"><i></i><span></span></div>
      </div>
      <div class="now-sub">
        <div id="nextTitle" class="now-next"></div>
        <button id="resumeChip" class="resume-chip" hidden><svg><use href="#i-resume"/></svg><span></span></button>
      </div>
    </div>

    <div class="seek" dir="ltr">
      <span id="tCur">0:00</span>
      <div class="seek-track">
        <input id="seek" class="range" type="range" min="0" max="1000" value="0" step="1">
        <div id="scrubTip" class="scrub-tip" hidden><canvas id="scrubCanvas" width="192" height="108"></canvas><span></span></div>
      </div>
      <span id="tDur">0:00</span>
    </div>

    <div class="transport">
      <div class="cgroup">
        <div class="glabel" data-i18n="gPlayback"></div>
        <div class="grp" dir="ltr">
          <button id="prevBtn" class="ib" data-i18n-title="tPrev"><svg><use href="#i-prev"/></svg></button>
          <button id="backBtn" class="ib sm" data-i18n-title="tBack"><svg><use href="#i-back"/></svg></button>
          <button id="frameBackBtn" class="ib sm frame" data-i18n-title="tFrameBack"><svg><use href="#i-frame-back"/></svg></button>
          <button id="playBtn" class="primary big" data-i18n-title="tPlay"><svg><use href="#i-play"/></svg></button>
          <button id="frameFwdBtn" class="ib sm frame" data-i18n-title="tFrameFwd"><svg><use href="#i-frame-fwd"/></svg></button>
          <button id="fwdBtn" class="ib sm" data-i18n-title="tFwd"><svg><use href="#i-fwd"/></svg></button>
          <button id="nextBtn" class="ib" data-i18n-title="tNext"><svg><use href="#i-next"/></svg></button>
          <button id="stopBtn" class="ib sm" data-i18n-title="tStop"><svg><use href="#i-stop"/></svg></button>
        </div>
      </div>
      <div class="cgroup">
        <div class="glabel" data-i18n="gScreen"></div>
        <div class="grp">
          <button id="blackBtn" class="ib toggle" data-i18n-title="tBlack"><svg><use href="#i-black"/></svg></button>
          <button id="freezeBtn" class="ib toggle freeze" data-i18n-title="tFreeze"><svg><use href="#i-freeze"/></svg></button>
          <button id="countdownBtn" class="ib toggle cd" data-i18n-title="tCountdown"><svg><use href="#i-timer"/></svg></button>
          <button id="fullBtn" class="ib" data-i18n-title="fullTitle"><svg><use href="#i-full"/></svg></button>
          <button id="showOnBtn" class="chip-btn" data-i18n-title="tShowOn"><svg><use href="#i-show-on"/></svg><span id="showOnLabel"></span><svg class="caret"><use href="#i-caret"/></svg></button>
        </div>
      </div>
      <div class="cgroup">
        <div class="glabel" data-i18n="gSound"></div>
        <div class="grp vol" dir="ltr">
          <button id="muteBtn" class="ib" data-i18n-title="tMute"><svg><use href="#i-vol"/></svg></button>
          <div class="vol-track">
            <input id="vol" class="range" type="range" min="0" max="200" value="100">
            <i class="vol-mark" title="100%"></i>
          </div>
          <span id="volPct">100%</span>
          <button id="karaokeBtn" class="ib toggle karaoke" data-i18n-title="tKaraoke"><svg><use href="#i-mic"/></svg><i class="ring"></i></button>
        </div>
      </div>
    </div>

    <div id="mixer" class="mixer cgroup" hidden>
      <div class="glabel" data-i18n="vocalRemover"></div>
      <div class="grp mix-grp">
        <div class="seg mix-presets">
          <button data-preset="karaoke" data-i18n="presetKaraoke"></button>
          <button data-preset="original" data-i18n="presetOriginal"></button>
          <button data-preset="vocals" data-i18n="presetVocals"></button>
        </div>
        <label class="mix-ch"><span data-i18n="vocalsLabel"></span><input id="mixVocals" class="range" type="range" min="0" max="100" dir="ltr"><b id="mixVocalsPct" dir="ltr"></b></label>
        <label class="mix-ch"><span data-i18n="musicLabel"></span><input id="mixMusic" class="range" type="range" min="0" max="100" dir="ltr"><b id="mixMusicPct" dir="ltr"></b></label>
        <button id="mixSave" class="ib" data-i18n-title="saveMix"><svg><use href="#i-download"/></svg></button>
      </div>
    </div>

    <div id="lyricsBar" class="lyrics-bar cgroup" hidden>
      <div class="glabel"><span data-i18n="lyrics"></span><span class="muted" data-i18n="lyricsHint"></span></div>
      <div class="grp lyr-grp">
        <div id="lyricSlides" class="lyr-slides"></div>
        <button id="lyricsOffBtn" class="ib" data-i18n-title="tLyricsOff"><svg><use href="#i-x"/></svg></button>
      </div>
    </div>

    <div class="options">
      <div class="opt-group">
        <label class="opt-btn" data-i18n-title="autoNext"><input type="checkbox" id="autoNext"><svg><use href="#i-autonext"/></svg></label>
        <label class="opt-btn" data-i18n-title="blackOnEnd"><input type="checkbox" id="blackOnEnd" checked><svg><use href="#i-black-end"/></svg></label>
        <label class="opt-btn" data-i18n-title="loop"><input type="checkbox" id="loopChk"><svg><use href="#i-loop"/></svg></label>
      </div>
      <div class="chips">
        <div id="activeChips" class="active-chips"></div>
        <button id="playSetBtn" class="chip-btn boxed" data-i18n-title="tPlaySettings"><svg><use href="#i-sliders"/></svg><span data-i18n="playSettings"></span><svg class="caret"><use href="#i-caret"/></svg></button>
      </div>
    </div>
  </section>

  <div id="sideGrip" class="side-grip" data-i18n-title="tSideGrip"></div>
  <aside class="side">
    <form id="ytForm" class="yt">
      <svg class="yt-ico"><use href="#i-yt"/></svg>
      <input id="ytUrl" type="text" dir="ltr" data-i18n-ph="ytPlaceholder" autocomplete="off" spellcheck="false">
      <button type="submit" id="streamBtn" class="primary" data-i18n="stream" data-i18n-title="tStream"></button>
      <button type="button" id="downloadBtn" class="split" data-i18n-title="tDownload"><span data-i18n="download"></span><svg><use href="#i-caret"/></svg></button>
    </form>
    <div id="clipBanner" class="clip-banner" hidden>
      <svg><use href="#i-link"/></svg>
      <div class="cb-text"><b data-i18n="clipTitle"></b><span id="clipUrl" dir="ltr"></span></div>
      <button id="clipPlay" class="primary small-btn" data-i18n="stream"></button>
      <button id="clipDl" class="small-btn" data-i18n="download"></button>
      <button id="clipClose" class="ib-x" data-i18n-title="close"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="side-actions">
      <button id="addFilesBtn" class="ghost"><svg><use href="#i-add"/></svg><span data-i18n="addVideos"></span></button>
      <button id="folderBtn" class="ghost"><svg><use href="#i-folder"/></svg><span data-i18n="downloadsFolder"></span></button>
    </div>

    <div id="downloads" class="downloads"></div>
    <div id="vocalJobs" class="downloads"></div>

    <div class="list-head">
      <button id="listPick" class="list-pick"><svg><use href="#i-list"/></svg><span id="listName"></span><svg class="caret"><use href="#i-caret"/></svg></button>
      <span id="listCount" class="muted"></span>
      <div class="spacer"></div>
      <button id="checkBtn" class="ib" data-i18n-title="tCheck"><svg><use href="#i-check"/></svg><i id="checkBadge" class="badge" hidden></i></button>
      <button id="searchBtn" class="ib" data-i18n-title="tSearch"><svg><use href="#i-search"/></svg></button>
    </div>
    <div id="searchRow" class="search-row" hidden>
      <svg><use href="#i-search"/></svg>
      <input id="searchInput" type="text" dir="auto" data-i18n-ph="searchPh" autocomplete="off" spellcheck="false">
      <button id="searchClear" class="ib-x"><svg><use href="#i-x"/></svg></button>
    </div>
    <ol id="playlist" class="playlist"></ol>
    <div id="emptyList" class="empty-list"><svg><use href="#i-add"/></svg><span id="emptyListText"></span></div>
  </aside>
</main>


<div id="toast" class="toast"></div>
<div id="modal" class="modal" hidden></div>
<div id="dropZone" class="drop-zone"><div><svg><use href="#i-add"/></svg><span data-i18n="dropHere"></span></div></div>
<video id="probe" preload="metadata" muted hidden></video>
<video id="scrub" preload="auto" muted hidden></video>

<script src="i18n.js"></script>
<script src="control.js"></script>
<script src="vocals-ui.js"></script>
<script src="features.js"></script>
</body>
</html>
